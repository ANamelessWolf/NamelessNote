type: object
properties:
  _id:
    type: string
    example: "66f0d3a85d2c3f1a4d0c5678"
  groupId:
    type: string
    description: "MongoDB ObjectId reference to groups collection"
    example: "66f0d3a85d2c3f1a4d0c1234"
  propertyNameOriginal:
    type: string
    description: "Original case-preserved property name"
    example: "DBPassword"
  propertyNameLower:
    type: string
    description: "Lowercased property name (for case-insensitive uniqueness)"
    example: "dbpassword"
  ownerId:
    type: string
    example: "109876543210987654321"
  ownerEmail:
    type: string
    format: email
    example: "user@example.com"
  authProvider:
    type: string
    example: "google"
  propertyValueEncrypted:
    type: string
    description: "AES-256-GCM encrypted property HTML stored as base64 ciphertext"
    example: "2K0V09fQ0Q8Wt8lM1P3L7A=="
  iv:
    type: string
    description: "Base64-encoded initialization vector used during encryption"
    example: "5dBfLwYQ2h4t2Y2M"
  authTag:
    type: string
    description: "Base64-encoded GCM authentication tag"
    example: "bSmRzv0A7fF39I7UP2V6WQ=="
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
