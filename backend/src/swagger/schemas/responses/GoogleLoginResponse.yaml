type: object
properties:
  success:
    type: boolean
    example: true
  statusCode:
    type: integer
    example: 200
  message:
    type: string
    example: "Authenticated with Google"
  data:
    type: object
    properties:
      accessToken:
        type: string
        description: JWT issued by NamelessNote for authenticated API access
        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      user:
        type: object
        properties:
          sub:
            type: string
            example: "109876543210987654321"
          email:
            type: string
            format: email
            example: "user@example.com"
          name:
            type: string
            example: "Demo User"
          picture:
            type: string
            format: uri
            example: "https://lh3.googleusercontent.com/a/example=s96-c"
