services:
  nameless_note_backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./backend:/app:rw
      - ./certs:/certs:ro
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - MONGO_URI=mongodb://nameless_note_db:27017/namelessnote
      - CORS_ORIGIN=http://localhost:3000,https://localhost:3000
      - HTTPS_ENABLED=true
      - HTTPS_CERT_FILE=../certs/namelessnote-local.pem
      - HTTPS_KEY_FILE=../certs/namelessnote-local-key.pem
    ports:
      - "4000:4000"

  nameless_note_front:
    image: node:20-alpine
    container_name: nameless_note_front_dev
    working_dir: /app
    depends_on:
      - nameless_note_backend
    volumes:
      - ./frontend:/app:rw
      - ./certs:/certs:ro
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=https://localhost:4000
      - VITE_GOOGLE_CLIENT_ID=365284291486-69ho133fiq0jt4oqn5im6kpp6n9rt449.apps.googleusercontent.com
      - DEV_HTTPS=true
      - DEV_HTTPS_CERT_FILE=../certs/namelessnote-local.pem
      - DEV_HTTPS_KEY_FILE=../certs/namelessnote-local-key.pem
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "3000:3000"
