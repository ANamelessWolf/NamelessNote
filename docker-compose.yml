services:
  nameless_note_db:
    image: mongo:8
    container_name: nameless_note_db
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nameless_note_backend:
    image: node:20-alpine
    container_name: nameless_note_backend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      nameless_note_db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://nameless_note_db:27017/namelessnote
      - CORS_ORIGIN=http://localhost:3000,https://localhost:3000
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./backend:/app:rw
      - ./certs:/certs:ro
      - backend_node_modules:/app/node_modules
    ports:
      - "4000:4000"

  nameless_note_front:
    image: node:20-alpine
    container_name: nameless_note_front
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - nameless_note_backend
    env_file:
      - ./frontend/.env
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=https://localhost:4000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - ./frontend:/app:rw
      - ./certs:/certs:ro
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "3000:3000"

volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:
